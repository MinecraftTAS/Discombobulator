// Plugins used in the project
plugins {
	id 'java-gradle-plugin'
	id 'maven-publish'
}

def snapshot = project.release=="true" ? "" : "-SNAPSHOT"
version = project.version+snapshot
// Name, version and group for the project
group = "com.minecrafttas"
base {
	archivesName = "discombobulator"
}

// Configure the gradle plugin
gradlePlugin {
	plugins {
		discombobulator {
			id = 'discombobulator'
			implementationClass = 'com.minecrafttas.discombobulator.Discombobulator'
		}
	}
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation(platform('org.junit:junit-bom:6.0.1'))
	testImplementation('org.junit.jupiter:junit-jupiter')
	testRuntimeOnly('org.junit.platform:junit-platform-launcher')
	implementation 'commons-io:commons-io:2.21.0'
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
	withJavadocJar()
}

javadoc {
	options.locale = "en_US"
	options.addBooleanOption('Xdoclint:none', true)
}

publishing {
	repositories {
		maven {
			name = "minecrafttasSnapshots"
			url = "https://maven.minecrafttas.com/snapshots"
			credentials(PasswordCredentials)
			authentication {
				basic(BasicAuthentication)
			}
		}
		maven {
			name = "minecrafttasMain"
			url = "https://maven.minecrafttas.com/main"
			credentials(PasswordCredentials)
			authentication {
				basic(BasicAuthentication)
			}
		}
	}
}